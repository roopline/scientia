# XcodeGen 用の定義。
#   brew install xcodegen && xcodegen generate
# （同梱の LabelCheck.xcodeproj をそのまま開いても構いません。こちらは
#   テストターゲット込みでプロジェクトを作り直したいとき用です）
name: LabelCheck
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LabelCheck:
    type: application
    platform: iOS
    sources:
      - path: LabelCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.labelcheck
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "ラベル照合"
        INFOPLIST_KEY_NSCameraUsageDescription: "貼付済みラベルの文字とバーコードを読み取り、商品と照合するためにカメラを使用します。"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  LabelCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LabelCheckTests
    dependencies:
      - target: LabelCheck
